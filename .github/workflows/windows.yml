name: Windows build and launch
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & $nsis Installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and check launch
        shell: pwsh
        run: |
          $setup = Join-Path (Split-Path $PWD) 'Hedge-Setup-0.4.13.exe'
          $process = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { $detail = Get-Content "$env:LOCALAPPDATA\Hedge\install.log" -Raw -ErrorAction SilentlyContinue; throw "Installer failed: $($process.ExitCode). $detail" }
          $exe = "$env:LOCALAPPDATA\Programs\Hedge\Hedge.exe"
          if (!(Test-Path $exe)) { throw 'Installer did not create Hedge.exe' }
          $app = Start-Process $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $log = Get-Content "$env:LOCALAPPDATA\Hedge\startup.log" -Raw -ErrorAction SilentlyContinue
            if ($app.HasExited -or $log -notmatch 'showing the left drawer' -or $log -match 'ERROR:') { throw "Launch failed. Exit: $($app.HasExited), log: $log" }
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }
      - name: Exercise tab and drives controls
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Hedge\Hedge.exe"
          $test = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (!$test.WaitForExit(30000)) { Stop-Process -Id $test.Id -Force; throw 'UI smoke test timed out' }
          $log = Get-Content "$env:LOCALAPPDATA\Hedge\startup.log" -Raw
          if ($log -notmatch 'UI_SMOKE_OK' -or $log -match 'UI_SMOKE_ERROR') { throw "UI smoke test failed: $log" }
      - name: Render isolated Hedge fixture
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Hedge\Hedge.exe"
          New-Item -ItemType Directory -Force visual | Out-Null
          $env:HEDGE_VISUAL_OUTPUT = Join-Path $PWD 'visual/hedge.png'
          $test = Start-Process $exe -ArgumentList '--visual-test' -PassThru
          if (!$test.WaitForExit(30000)) { Stop-Process -Id $test.Id -Force; throw 'Visual test timed out' }
          $log = Get-Content "$env:LOCALAPPDATA\Hedge\startup.log" -Raw
          if ($log -notmatch 'VISUAL_TEST_OK' -or $log -match 'VISUAL_TEST_ERROR' -or !(Test-Path $env:HEDGE_VISUAL_OUTPUT)) { throw "Visual test failed: $log" }
      - name: Upload isolated app rendering
        uses: actions/upload-artifact@v4
        with:
          name: Hedge-visual-fixture
          path: visual/hedge.png
      - name: Stage installer artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Join-Path (Split-Path $PWD) "Hedge-Setup-0.4.13.exe") dist/
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hedge-Setup-0.4.13
          path: dist/Hedge-Setup-0.4.13.exe

